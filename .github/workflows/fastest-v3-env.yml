name: fastest-v3-env
# Lane fastest-linux-v3: a record-only probe of the hosted runners' facts the V3 probe depends on
# (fastest/linux/v3/envprobe.sh). Temporary; removed once the design is fixed.
on:
  workflow_dispatch:
  push:
    branches: [fastest-linux-v3]
    paths:
      - "fastest/linux/v3/envprobe.sh"
      - ".github/workflows/fastest-v3-env.yml"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  env:
    name: v3 env (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q xfsprogs btrfs-progs strace nvme-cli
      - name: Probe
        run: timeout 900 bash fastest/linux/v3/envprobe.sh env-raw
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-env-${{ matrix.runner }}
          path: env-raw/
          retention-days: 30
