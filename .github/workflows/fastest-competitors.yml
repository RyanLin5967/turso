name: fastest-competitors
# Lane fastest-linux-comp: the FASTEST competitors on Linux -- PostgreSQL 18 (PGDG; STRATEGY=FILE_COPY with
# file_copy_method=clone and STRATEGY=WAL_LOG at D2 = pg18-d2, amendment 14, plus the clone proof's copy control
# pg18-create-copy; pg18-defaults is DROPPED on Linux by the lead's ruling, artie DECISIONS 6b0bef481b: on Linux it
# configures the same server as pg18-d2, and PREREG-CORE v2's OUT list excludes PG18 at its defaults),
# Dolt and Doltgres at the registered versions of versions.tsv (2.4.1, 1.4.0: release binaries, sha256-checked, telemetry off; amendment 14
# variants (a), (b), (c)), and the B1 file-copy baseline (FICLONE of a stock-SQLite db + fsync(clone) + fsync(dir),
# and its D0 no-flush row) -- on ubuntu x86_64 and arm64, each on XFS and btrfs loop filesystems.
# Every job records its hardware (fastest/linux/hw/record.sh) and fire-checks the flush counter before using it.
# Per cell (system x spec x C in {1, 4}): the SMOKE.md functional checks and flushes per op counted by strace -f -C,
# raw and with an idle control subtracted, split by process role. SMOKE ONLY: nothing timed here is credited before
# the PREREG is registered. Raw output is uploaded per job (artifact competitors-<system>-<runner>-<fs>).

on:
  workflow_dispatch:
    inputs:
      n1:
        description: "ops per cell at C=1"
        default: "200"
      n4:
        description: "ops per cell at C=4"
        default: "200"
      rows:
        description: "parent table rows"
        default: "10000"
      idle_s:
        description: "seconds of the idle control per cell"
        default: "30"
      cap_s:
        description: "per-run cap in seconds: the measured window's bound (registered: 1800)"
        default: "1800"
      warmup:
        description: "warm-up OPS:S:MAX_S (smoke cap 1000:10:2; PREREG :210's rule at 1800 s is 1000:10:180; empty gives 1000:10:2)"
        default: "1000:10:2"
      age:
        description: "aging UPDATEs applied to the parent (PREREG §7: 1e5; 0 = fresh)"
        default: "200"
      prebranch:
        description: "live branches made before the cells, each with one private write"
        default: "20"
  push:
    branches: [fastest-branching, fastest-linux-comp]
    paths:
      - "fastest/linux/competitors/**"
      - "fastest/linux/hw/**"
      - "fastest/linux/fs/**"
      - ".github/workflows/fastest-competitors.yml"

concurrency:
  group: fastest-competitors-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every run step under bash -eo pipefail (GitHub's `shell: bash`). The implicit default is `bash -e {0}` with NO
# pipefail, so `mkloop.sh ... | tee` succeeded when mkloop failed and the steps.fs guard below could never trip
# (review finding 7, run 37175962413).
defaults:
  run:
    shell: bash

jobs:
  build:
    name: build tools (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Lead ruling (artie DECISIONS 6b0bef481b): the smoke warm-up cap is for smoke only, so a real run (FT_DRY=0, or
      # unset) with it must refuse; plant_real.sh makes run_system.sh meet it, the dropped pg18-defaults and the other
      # real-run refusals, plus controls that must get past them. A failure here fails the build, so no cell runs.
      - name: Refusal plants (a real run with the smoke warm-up cap, pg18-defaults) and timedrun.py selftest
        run: |
          timeout 120 python3 -B fastest/linux/competitors/timedrun.py selftest | tail -1
          timeout 600 bash fastest/linux/competitors/plant_real.sh "$RUNNER_TEMP/plant-real"
          # the drive class (SMOKE erratum E3): known answers, then this runner's own disk under its temp dir
          timeout 120 python3 -B fastest/linux/competitors/drive.py selftest | tail -1
          timeout 120 python3 -B fastest/linux/competitors/drive.py record "$RUNNER_TEMP" "$RUNNER_TEMP/drive-build.json"
      - name: Packages (PGDG libpq 18, MariaDB connector, clang, cmake, fio)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q libpq-dev libmariadb-dev clang cmake pkg-config fio
      - name: Hardware record
        run: bash fastest/linux/hw/record.sh "$RUNNER_TEMP/build-hw" "$RUNNER_TEMP/hw-target" 15
      - name: Build bbload, clonebench, sqlite3 (BB_HOOKS=0)
        run: timeout 1500 bash fastest/linux/competitors/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: competitor-tools-${{ matrix.runner }}
          path: dist/
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-hw-${{ matrix.runner }}
          path: ${{ runner.temp }}/build-hw/
          retention-days: 90

  run:
    name: ${{ matrix.system }} (${{ matrix.runner }}, ${{ matrix.fs }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        fs: [xfs, btrfs]
        # pg18-defaults is dropped on Linux (lead ruling, artie 6b0bef481b); reduce.py pins these systems
        system: [pg18-d2, dolt, doltgres, b1]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MNT: /mnt/fastest-${{ matrix.fs }}
      RAW: ${{ github.workspace }}/fastest-raw
      FT_N1: ${{ inputs.n1 || '200' }}
      FT_N4: ${{ inputs.n4 || '200' }}
      FT_ROWS: ${{ inputs.rows || '10000' }}
      FT_IDLE_S: ${{ inputs.idle_s || '30' }}
      # The registered 1800 s cap bounds every measured window (gate-6 item 16). SMOKE overrides only the warm-up's
      # MAX_S: 1000:10:2 is PREREG :210's OPS and S with at most 2 s of warm-up (a full 1000-op warm-up per run would
      # add ~30 min and ~9 GB per WAL_LOG cell here); every run records the rule it used. An empty input also gives
      # 1000:10:2 (the `||` default); pass 1000:10:180 for the registered rule. That cap is accepted for SMOKE only
      # (lead ruling, artie DECISIONS 6b0bef481b): these jobs say so with FT_DRY=1, and run_system.sh refuses the cap
      # on a real run (FT_DRY=0, its default; the build job's plant proves it).
      FT_CAP_S: ${{ inputs.cap_s || '1800' }}
      FT_WARMUP: ${{ inputs.warmup || '1000:10:2' }}
      FT_DRY: "1"
      # SMOKE: a small aging and a few live branches, so both fixture paths run on every system (gate-6 item 4);
      # the registered T3 values are 1e5 UPDATEs and N in {1, 1e4}.
      FT_AGE: ${{ inputs.age || '200' }}
      FT_PREBRANCH: ${{ inputs.prebranch || '20' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: competitor-tools-${{ matrix.runner }}
          path: dist
      - name: Packages (PGDG postgresql-18 without a default cluster, MariaDB client, strace, fs tools, fio)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          # PostgreSQL pinned to the registered package of versions.tsv (gate-6 review, t3run item 13); a PGDG
          # repository without it fails here rather than installing another version.
          pgv=$(awk -F'\t' '$1 == "postgresql" && $4 == "pgdg_package" {print $5}' fastest/linux/competitors/versions.tsv)
          [ -n "$pgv" ] || { echo "no postgresql row in versions.tsv"; exit 1; }
          sudo apt-get install -y -q "postgresql-18=$pgv" "postgresql-client-18=$pgv" "libpq5=$pgv" mariadb-client libmariadb3 strace xfsprogs btrfs-progs fio lsof
          sudo systemctl stop postgresql || true
          pg_lsclusters || true
      # The servers' ports (PG 55432, Doltgres 55433, Dolt 53306) lie inside the ephemeral range 32768-60999, so a
      # client socket could draw one as its source port and block the bind (lane fastest-linux's T3 dry run
      # 37256446468). Reserved before anything else runs; common.sh's require_port_free also refuses any bound socket.
      - name: Reserve the servers' ports from the ephemeral range
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=53306,55432-55433
          sysctl net.ipv4.ip_local_reserved_ports | grep -q '53306' || { echo "port reservation not in effect"; exit 1; }
      - name: Run info
        run: |
          mkdir -p "$RAW"
          chmod +x dist/bbload dist/clonebench dist/sqlite3
          { echo "git_sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT runner=${{ matrix.runner }} fs=${{ matrix.fs }} system=${{ matrix.system }}";
            echo "image=${ImageOS:-?} ${ImageVersion:-?} runner_name=$RUNNER_NAME";
            echo "n1=$FT_N1 n4=$FT_N4 rows=$FT_ROWS idle_s=$FT_IDLE_S cap_s=$FT_CAP_S warmup=$FT_WARMUP dry=$FT_DRY (smoke, uncredited) age=$FT_AGE prebranch=$FT_PREBRANCH";
            echo "systems=pg18-d2,dolt,doltgres,b1 pg18-defaults=DROPPED (lead ruling artie 6b0bef481b: on Linux it is pg18-d2's server; pg18-d2 runs the copy control pg18-create-copy)";
            cat dist/build-info.txt; strace -V | sed -n 1p; /usr/lib/postgresql/18/bin/postgres --version;
            mariadb --version; pg_lsclusters 2>&1 || true; } | tee "$RAW/run-info.txt"
      - name: Dolt and Doltgres release binaries
        if: matrix.system == 'dolt' || matrix.system == 'doltgres'
        run: bash fastest/linux/competitors/fetch_dolt.sh "$HOME/fastest-bin" "$RAW/dolt-fetch.txt"
      - name: Filesystem under test
        id: fs
        # 80G sparse: each cell now runs twice (a traced labelling run and an untraced timed run, gate-6 item 2) plus
        # warm-ups, WAL_LOG and the copy control writing ~9 MB per created database; run 37551016447's pg18-defaults
        # XFS job peaked at 17.9 GB used with one run per cell. / has ~91 GB free on these runners.
        run: bash fastest/linux/fs/mkloop.sh ${{ matrix.fs }} "$MNT" 80G 2>&1 | tee "$RAW/mkloop.txt"
      - name: Hardware record (fio on the filesystem under test)
        run: bash fastest/linux/hw/record.sh "$RAW/hw" "$MNT/hw" 15
      - name: Allow strace to attach to the servers (ptrace_scope 0)
        if: ${{ !cancelled() && steps.fs.outcome == 'success' }}
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Flush counter fire-check
        id: fc
        if: ${{ !cancelled() && steps.fs.outcome == 'success' }}
        run: timeout 600 bash fastest/linux/competitors/firecheck_strace.sh "$RAW/firecheck" "$MNT/firecheck.noindex"
      # Only after the counter's fire-check passed on this runner and filesystem (review finding 8: the run used to
      # proceed after a failed fire-check and its cells still said ok). run_system.sh re-checks the verdict file.
      - name: Run ${{ matrix.system }}
        if: ${{ !cancelled() && steps.fs.outcome == 'success' && steps.fc.outcome == 'success' }}
        env:
          FT_BBLOAD: ${{ github.workspace }}/dist/bbload
          FT_CLONEBENCH: ${{ github.workspace }}/dist/clonebench
          FT_SQLITE3: ${{ github.workspace }}/dist/sqlite3
          FT_FIRECHECK: ${{ github.workspace }}/fastest-raw/firecheck/firecheck.txt
        run: timeout 12600 bash fastest/linux/competitors/run_system.sh ${{ matrix.system }} "$MNT" "$RAW/run"
      - name: Compress traces
        if: always()
        run: find "$RAW" -name '*.strace' -exec gzip -9 {} + || true
      - name: Upload raw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitors-${{ matrix.system }}-${{ matrix.runner }}-${{ matrix.fs }}
          path: fastest-raw/
          retention-days: 90

  # The run's verdict, computed on CI from every job's raw (QUIET mode allows no local post-processing): reduce.py
  # over the downloaded competitors-* artifacts, against the workflow at this commit and its pinned matrix, cells and
  # fire-check names. Fails when an expected job or cell is missing or not ok (exit 1) or the expectation cannot be
  # determined (exit 2); its output is uploaded as competitors-reduce, which bank.sh banks with the rest.
  reduce:
    name: reduce (every expected job and cell)
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: competitors-*
          path: ${{ runner.temp }}/runs
      - name: reduce.py
        run: |
          mkdir -p "$RUNNER_TEMP/reduce"
          rc=0
          timeout 1200 python3 -B fastest/linux/competitors/reduce.py "$RUNNER_TEMP/runs" \
            >"$RUNNER_TEMP/reduce/reduce.tsv" 2>"$RUNNER_TEMP/reduce/reduce.err" || rc=$?
          echo "reduce_rc=$rc git_sha=$GITHUB_SHA run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT" | tee "$RUNNER_TEMP/reduce/reduce-rc.txt"
          grep '^JOBS' "$RUNNER_TEMP/reduce/reduce.tsv" | cut -f2-5 || true
          grep '^DRIVES' "$RUNNER_TEMP/reduce/reduce.tsv" | cut -f2-4 || true
          echo "CELLS rows: $(grep '^CELLS' "$RUNNER_TEMP/reduce/reduce.tsv" | awk 'END {print NR - 1}')"
          cat "$RUNNER_TEMP/reduce/reduce.err"
          # SMOKE.md's tables, generated here from the same raw (smoke_table.py, C=1 and C=4)
          for c in 1 4; do
            timeout 600 python3 -B fastest/linux/competitors/smoke_table.py "$RUNNER_TEMP/runs" "$c" \
              >"$RUNNER_TEMP/reduce/smoke-c$c.md" 2>"$RUNNER_TEMP/reduce/smoke-c$c.err" || rc=$(( rc == 0 ? 3 : rc ))
          done
          exit $rc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitors-reduce
          path: ${{ runner.temp }}/reduce/
          retention-days: 90
