[package]
name = "turso_pg_parser"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL parser for Turso"

[lints]
workspace = true

[lib]
name = "turso_pg_parser"
path = "lib.rs"

[dependencies]
smallvec = "1.15.1"
compact_str = "0.8.1"
pg_query = "6.1"
prost = { version = "0.13", features = ["no-recursion-limit", "turso-stack-guard"] }
miette = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
turso_parser = { workspace = true }
turso_stack_guard = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enable validation against real PostgreSQL (requires psql installed)
validate_psql = []
