[package]
name = "turso_pg_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL wire-protocol server support for Turso"

[lib]
path = "lib.rs"

[features]
# The wire budget's fire-check plant (lanes/wire/budget/budget.py --plant split-reply): never in a credited
# build.
budget-plant-split-reply = []
# The wire budget's allocation counter (budget.py work): the binaries install counters::CountingAlloc.
# Never in a credited build: every allocation pays a shared atomic add.
alloc-count = []

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
futures = { workspace = true }
libc = "0.2.172"
pgwire = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal"] }
tracing = { workspace = true }
turso_core = { workspace = true, default-features = true, features = [
    "conn_raw_api",
] }
turso_pg = { workspace = true }
turso_pg_parser = { workspace = true }
turso_parser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The frontend's test failpoints, for this crate's own tests alone (resolver 2 keeps a
# dev-dependency's features out of every other build).
turso_pg = { workspace = true, features = ["failpoints"] }

[lints]
workspace = true
